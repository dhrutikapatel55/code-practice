
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trading Output Dashboard</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a; /* dark blue */
      color: #e5e7eb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .dashboard {
      max-width: 1000px;
      margin: auto;
      background: #020617;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #94a3b8;
    }

    .card .value {
      font-size: 22px;
      font-weight: bold;
    }

    .profit { color: #22c55e; }
    .loss { color: #ef4444; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }

    thead {
      background: #020617;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    th {
      font-size: 13px;
      color: #cbd5f5;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: #020617;
    }

    .buy {
      color: #22c55e;
      font-weight: bold;
    }

    .sell {
      color: #ef4444;
      font-weight: bold;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <h1>Trading Output Dashboard</h1>

  <div class="dashboard">
    <!-- Summary Section -->
    <div class="summary">
      <div class="card">
        <h3>Account Balance</h3>
        <div class="value">₹ 150,000</div>
      </div>
      <div class="card">
        <h3>Today's P/L</h3>
        <div class="value profit">+ ₹ 2,450</div>
      </div>
      <div class="card">
        <h3>Total Trades</h3>
        <div class="value">18</div>
      </div>
      <div class="card">
        <h3>Win Rate</h3>
        <div class="value">61%</div>
      </div>
    </div>

    <!-- Trades Table -->
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Symbol</th>
          <th>Type</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>P/L</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>10:15</td>
          <td>golu</td>
          <td class="buy">BUY</td>
          <td>62,350</td>
          <td>0.01</td>
          <td class="profit">+450</td>
        </tr>
        <tr>
          <td>11:02</td>
          <td>molu</td>
          <td class="sell">SELL</td>
          <td>3,420</td>
          <td>0.2</td>
          <td class="loss">-180</td>
        </tr>
        <tr>
          <td>13:40</td>
          <td>tolu</td>
          <td class="buy">BUY</td>
          <td>22,150</td>
          <td>50</td>
          <td class="profit">+2,180</td>
        </tr>
      </tbody>
    </table>
  </div>

  <footer>
    Sample trading output UI using HTML & CSS only
  </footer>
</body>
</html>
